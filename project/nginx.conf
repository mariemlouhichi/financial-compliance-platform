# ============================================================================
#  nginx — sert l'interface React et relaie l'API.
#
#  Un seul point d'entrée public (port 80) :
#     /        → fichiers statiques du bundle Vite
#     /api/... → conteneur de l'API (uvicorn:8001)
#
#  Conséquence : le navigateur ne parle qu'à une seule origine → aucun CORS.
# ============================================================================

server {
    listen 80;
    server_name _;

    # Justificatifs transmis en base64 dans le corps JSON → besoin de marge.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # ── Flux temps réel (SSE) ──────────────────────────────────────────────
    #  DOIT être déclaré AVANT /api/ : nginx retient le tampon par défaut,
    #  ce qui bloquerait les événements jusqu'à saturation du buffer.
    location /api/events {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;

        proxy_buffering off;          # indispensable pour le SSE
        proxy_cache off;
        gzip off;                     # ne pas compresser un flux continu
        chunked_transfer_encoding off;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le flux reste ouvert : pas de coupure prématurée.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ── API classique ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une analyse complète peut durer ~1 min (étape de retrieval).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Fichiers statiques ─────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # L'application utilise un routage par hash : le serveur ne voit jamais
    # les routes internes. Le repli reste utile en cas d'accès direct.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
